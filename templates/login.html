<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Login | Mike Shop</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">

    <div class="login-box">
        <h1 style="margin-bottom: 10px;">MIKE Shop</h1>
        <p style="margin-bottom: 20px; color: #555;">Please Login</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="error">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" autocomplete="username" placeholder="Username" required>
            <br><br>
            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <div style="margin-top: 15px; font-size: 0.9em; color: #777;">
            <!-- Default owner: <strong>admin</strong> / <strong>admin123</strong> -->
        </div>

        <div style="margin-top: 10px; font-size: 0.8em; color: #aaa;">
            Powered by Mike Shop Web App
        </div>
    </div>

</body>
</html>
