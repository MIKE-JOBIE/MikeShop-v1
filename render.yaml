services:
  - type: web
    name: mikeShop-v1
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: |
      pip install -r requirements.txt
      flask db upgrade
    startCommand: |
      gunicorn app:app --worker-class eventlet -w 1 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET_KEY
        generateValue: true
      - key: OWNER_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: API_KEY
        generateValue: true
      - key: ONLINE_STORE_ENABLED
        value: "True"
      - key: STORE_URL
        sync: false
      - key: SOCIAL_FACEBOOK_URL
        sync: false
      - key: SOCIAL_INSTAGRAM_URL
        sync: false
      - key: SOCIAL_LINKEDIN_URL
        sync: false
      - key: SOCIAL_WHATSAPP_URL
        sync: false
    healthCheckPath: /healthz
 